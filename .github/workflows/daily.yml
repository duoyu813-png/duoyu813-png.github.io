name: 本草日课

on:
  schedule:
    - cron: '0 1 * * *'   # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:       # 支持手动触发
    inputs:
      force:
        description: '强制重新生成当天文章'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成本草日课
        id: gen
        env:
          LLM_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          LLM_BASE_URL: https://open.bigmodel.cn/api/paas/v4
          LLM_MODEL: glm-4.5-flash
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node tools/generate-daily.js

      - name: 发送邮件
        if: steps.gen.outputs.generated == 'true'
        continue-on-error: true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
        run: node tools/send-mail.js

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily
          if git diff --cached --quiet; then
            echo "没有新的日课，无需提交"
          else
            git commit -m "chore(daily): 本草日课 $(date -u -d '+8 hours' +%F)"
            git push
          fi
